name: Deploy
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # nightly window — adjust to your users' timezone
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == '1'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - id: s
        run: |
          echo "running=$(ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} status)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: need
        run: echo "go=$([ '${{ github.event_name }}' = schedule ] && [ '${{ steps.s.outputs.running }}' = '${{ steps.s.outputs.sha }}' ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
      # ... your lint / type-check / test steps here, each with: if: steps.need.outputs.go == '1'
      - uses: docker/setup-buildx-action@v3
        if: steps.need.outputs.go == '1'
      - uses: docker/login-action@v3
        if: steps.need.outputs.go == '1'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        if: steps.need.outputs.go == '1'
        with:
          push: true
          build-args: GIT_SHA=${{ steps.s.outputs.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.s.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.need.outputs.go == '1'
        run: ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} deploy ${{ steps.s.outputs.sha }}
